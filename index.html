        <section id="noscript-about">
          <h2>About University of Central Punjab Bahawalpur Campus</h2>
          <p>Constituent College UCP Campus Bahawalpur (UCP BWP) is an official academic constituent unit owned, maintained, and administered directly by the University of Central Punjab, Lahore. As part of the Punjab Group of Colleges (PGC) network, the Bahawalpur campus enables students across Southern Punjab to earn an official HEC-recognized degree close to home.</p>
          <p><strong>Campus Location:</strong> Constituent College, UCP Campus, Airport Road, Bahawalpur, Punjab, Pakistan.<br />
          <strong>Contact Telephones:</strong> 062-2202030 / 062-2202050<br />
          <strong>Official Email:</strong> Principal.bahawalpur@ucp.edu.pk</p>
        </section>

        <section id="noscript-programs">
          <h2>Academic Degree Programs (BS &amp; ADP)</h2>
          <p>UCP Bahawalpur offers accredited undergraduate four-year BS and two-year Associate Degree Programs (ADP):</p>
          <ul>
            <li><strong>Faculty of Information Technology:</strong> BS Computer Science, ADP Artificial Intelligence, ADP Software Engineering, ADP Cyber Security, ADP Data Science, ADP Computer Science.</li>
            <li><strong>Faculty of Management Studies:</strong> Bachelor of Business Administration (BBA Honors), BS Business Analytics, BS Accounting &amp; Finance, ADP Business Administration, ADP Business Analytics, ADP Accounting &amp; Finance.</li>
            <li><strong>Faculty of Science &amp; Technology:</strong> BS Biotechnology, BS Biochemistry, BS Chemistry, BS Physics, BS Mathematics, BS Zoology, ADP Biotechnology, ADS Math/Physics, ADS Zoology/Botany/Chemistry.</li>
            <li><strong>Faculty of Humanities &amp; Social Sciences:</strong> BS English Language &amp; Literature, BS Psychology, ADP English, ADP Psychology.</li>
          </ul>
        </section>

        <section id="noscript-fees-scholarships">
          <h2>Fee Structure &amp; Scholarships</h2>
          <p>UCP Bahawalpur provides transparent credit hour fee structures ranging from Rs. 4,100 to Rs. 6,800 per credit hour, with easy semester installment plans. Scholarships include:</p>
          <ul>
            <li>Up to 50% Merit Scholarships based on Intermediate exam marks and semester CGPA.</li>
            <li>25% Tuition Fee Concession for Punjab Group of Colleges (PGC) alumni.</li>
            <li>25% Kinship Concession for siblings studying across the network.</li>
            <li>Need-based financial aid, sports scholarships, and defense personnel concessions.</li>
          </ul>
        </section>

        <section id="noscript-admissions">
          <h2>Admissions Procedure</h2>
          <p>Admissions are open for Fall 2026. Minimum eligibility is 50% marks in Intermediate (FSc / ICS / FA / I.Com / A-Levels). Prospective students can apply online at the official admission portal: <a href="https://admissions.ucpcolleges.pgc.edu/login?returnUrl=%2Flogin%3FreturnUrl%3D%252F">https://admissions.ucpcolleges.pgc.edu</a> or visit the campus admissions office on Airport Road Bahawalpur.</p>
