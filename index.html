    <script>
      // Cleanly filter harmless Vite HMR WebSocket connection logs in sandbox iframe environment
      (function() {
        if (typeof window === 'undefined') return;

        function isWsMsg(item) {
          if (!item) return false;
          var str = '';
          if (typeof item === 'string') {
            str = item;
          } else if (item instanceof Error) {
            str = (item.message || '') + ' ' + (item.stack || '');
          } else if (typeof item === 'object') {
            try {
              str = (item.message || '') + ' ' + (item.reason || '') + ' ' + JSON.stringify(item);
            } catch (e) {
              str = String(item);
            }
          } else {
            str = String(item);
          }
          return str.indexOf('WebSocket') !== -1 || 
                 str.indexOf('closed without opened') !== -1 || 
                 str.indexOf('[vite] connecting') !== -1 ||
                 str.indexOf('[vite] failed to connect') !== -1 ||
                 str.indexOf('vite:ws') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsMsg(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsMsg(event.message || event.error)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        var filterMethod = function(origFn) {
          if (!origFn) return function() {};
          return function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isWsMsg(arguments[i])) return;
            }
            return origFn.apply(console, arguments);
          };
        };

        console.log = filterMethod(console.log);
        console.info = filterMethod(console.info);
        console.warn = filterMethod(console.warn);
        console.error = filterMethod(console.error);
        console.debug = filterMethod(console.debug);
      })();
    </script>

    <script>
      // Graceful fallback detector if opened statically on GitHub Pages without running Vite build
      setTimeout(function() {
        var statusEl = document.getElementById('ucp-loading-status');
        if (statusEl && document.getElementById('root') && document.getElementById('root').contains(statusEl)) {
          if (window.location.hostname.indexOf('github.io') !== -1) {
            statusEl.innerHTML = '<span style="color:#FCA5A5;font-weight:600;">GitHub Pages Setup Notice:</span><br/><span style="font-size:11px;color:#E2E8F0;line-height:1.5;display:block;margin-top:6px;">To view this React app on GitHub Pages, go to repository <b>Settings &rarr; Pages &rarr; Build and deployment &rarr; Source</b> and select <b>GitHub Actions</b>.</span>';
          }
        }
      }, 3500);
